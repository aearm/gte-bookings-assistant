# Look and feel: Apple-like (Inter font, Apple blue, light grey page with white cards).
# Chart colours are a colour-blind-checked palette; charts.py uses the same values.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "full"
showWidgetBorder = true

[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#256abf", "#184f95", "#0d366b"]

[theme.light.sidebar]
backgroundColor = "#fbfbfd"
secondaryBackgroundColor = "#f5f5f7"

[theme.dark]
primaryColor = "#0a84ff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
linkColor = "#2997ff"
borderColor = "#38383a"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#6da7ec", "#9ec5f4", "#cde2fb"]

[theme.dark.sidebar]
backgroundColor = "#111113"
secondaryBackgroundColor = "#1c1c1e"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
